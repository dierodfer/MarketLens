<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketLens</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --surface: #ffffff;
            --text: #1d1d1f;
            --text-2: #6e6e73;
            --separator: #f0f0f2;
            --hairline: rgba(0, 0, 0, 0.04);
            --accent: #0071e3;
            --ok: #1a7f37;
            --ok-bg: #e8f5ec;
            --warn: #9a5b00;
            --warn-bg: #fff4e0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1c1c1e;
                --surface: #2c2c2e;
                --text: #f5f5f7;
                --text-2: #a1a1a6;
                --separator: #3a3a3c;
                --hairline: rgba(255, 255, 255, 0.06);
                --accent: #0a84ff;
                --ok: #4ade80;
                --ok-bg: rgba(48, 209, 88, 0.16);
                --warn: #ffb340;
                --warn-bg: rgba(255, 159, 10, 0.16);
            }
        }

        * { box-sizing: border-box; }

        body {
            width: 320px;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header img {
            width: 36px;
            height: 36px;
            border-radius: 9px;
        }

        .header h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .header span {
            font-size: 12px;
            color: var(--text-2);
        }

        .banner {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            background: var(--surface);
            color: var(--text-2);
        }

        .banner::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
        }

        .banner.ok { background: var(--ok-bg); color: var(--ok); }
        .banner.warn { background: var(--warn-bg); color: var(--warn); }

        .list {
            background: var(--surface);
            border-radius: 14px;
            box-shadow: 0 0 0 1px var(--hairline);
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 13px 16px;
            font-size: 14px;
            border-bottom: 1px solid var(--separator);
        }

        .row:last-child { border-bottom: none; }

        .row span:last-child { color: var(--text-2); }

        .hint {
            margin: 0;
            font-size: 12px;
            line-height: 1.45;
            color: var(--text-2);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="icons/icon128.png" alt="">
        <div>
            <h1>MarketLens</h1>
            <span id="version">Versión</span>
        </div>
    </div>

    <output class="banner" id="connection">Conectando…</output>

    <div class="list">
        <div class="row">
            <span>Filtro</span>
            <span id="current-status">–</span>
        </div>
        <div class="row">
            <span>Productos</span>
            <span id="results-count">–</span>
        </div>
        <div class="row">
            <span>Inicializado</span>
            <span id="initialization-status">–</span>
        </div>
    </div>

    <p class="hint">Controla los filtros desde el panel lateral de la página.</p>

    <script src="popup.js"></script>
</body>
</html>
