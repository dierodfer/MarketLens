name: CI

# Solo en pull requests contra la rama por defecto (master) y a mano.
# Los push directos a master no lanzan la CI: todo cambio entra por PR.
on:
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma PR cancela la ejecución que siga en curso.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, tests y empaquetado
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # Una sola dependencia: restaurar la caché cuesta lo mismo que instalarla
          package-manager-cache: false

      # Primero lo barato: si falla, no se descarga el navegador
      - name: Comprobar sintaxis
        run: npm run lint

      - name: Tests unitarios
        run: npm run test:unit

      # --ignore-scripts: ninguna dependencia necesita scripts de instalación
      - name: Instalar dependencias
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Solo Chromium completo (sin headless shell, que no puede cargar extensiones).
      # Sin --with-deps: la imagen ubuntu-24.04 ya trae las librerías que necesita.
      # Se usa el binario local (versión fijada por package-lock.json), no npx.
      - name: Instalar Chromium
        run: ./node_modules/.bin/playwright install chromium --no-shell

      - name: Tests E2E
        run: npm run test:e2e

      - name: Subir informe de Playwright
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # El artefacto se descarga como .zip listo para "Cargar descomprimida"
      - name: Publicar extensión
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketlens-extension
          path: |
            manifest.json
            background.js
            content.js
            inject.js
            popup.html
            popup.js
            styles.css
            icons/*.png
          if-no-files-found: error
          retention-days: 14
