name: Release

# Se lanza en cada push a master (es decir, al fusionar una PR). Pasa lint y tests y
# ejecuta semantic-release, que calcula la versión a partir de los commits
# convencionales. Si hay cambios que lo justifiquen, actualiza manifest.json y
# package.json, crea la etiqueta vX.Y.Z y la release de GitHub con el .zip adjunto.
# Si no hay commits que generen release (chore, docs, ci...) no publica nada.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Probar y publicar
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # commit de versión, etiqueta y release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release lee el historial y las etiquetas
          persist-credentials: true # el plugin git sube el commit de versión

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Instalar dependencias
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Comprobar sintaxis
        run: npm run lint

      - name: Tests unitarios
        run: npm run test:unit

      - name: Instalar Chromium
        run: ./node_modules/.bin/playwright install chromium --no-shell

      - name: Tests E2E
        run: npm run test:e2e

      # Sin etiquetas semantic-release publicaría 1.0.0. Se parte de v0.0.0 sobre el commit
      # actual para que la primera release salga como 0.0.1 (el siguiente fix:).
      - name: Crear la etiqueta base v0.0.0 si no hay ninguna
        run: |
          if [ -z "$(git tag --list 'v*')" ]; then
            git tag v0.0.0
            git push origin v0.0.0
          fi

      - name: Publicar con semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./node_modules/.bin/semantic-release
